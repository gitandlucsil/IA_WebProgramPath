<!DOCTYPE html>
    <head>
        <meta charset="UTF-8">
        <title>Preencher formulário</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <main>
            <section>
                <form actipon="#" method="POST">
                    <fieldset>
                        <legend>Seus dados</legend>
                        <label for="nome">Seu nome:</label>
                        <input type="text" id="nome" name="nome" autocomplet="name" minlength="3" maxlength="60" placeholder="Digite seu nome" required>

                        <label for="email">E-mail:</label>
                        <input type="email" id="email" name="email" autocomplete="email" required>
                    </fieldset>

                    <label for="mensagem">Mensagem:</label>
                    <textarea id="mensagem" name="mensagem" minlength="10" maxlength="500" rows="4" aria-describedby="ajuda-mensagem" required></textarea>

                    <p id="ajuda-mensagem"> Escreve uma mensagem entre 10 e 500 caracteres. </p>
                    <p id="mensagem-resultado"></p>
                    <button class="btn-enviar" type="submit">Enviar</button>
                </form>
            </section>
        </main>
        <footer>
            <p><a href="index.html">Voltar ao inicio</a></p>
        </footer>
        <script src="formulario_script.js"></script>
    </body>
</html>
